services:
  - type: web
    name: localfix-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: free
    envVars:
      - key: PORT
        value: "8080"
      - key: SPRING_DATASOURCE_DRIVER
        value: org.postgresql.Driver
      - key: SPRING_JPA_DATABASE_PLATFORM
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: FLYWAY_ENABLED
        value: "true"
      - key: ALLOWED_ORIGINS
        value: "https://*.netlify.app,http://localhost:5173"
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: localfix-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: localfix-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: localfix-db
          property: password

databases:
  - name: localfix-db
    databaseName: localfixdb
    region: singapore
    plan: free
